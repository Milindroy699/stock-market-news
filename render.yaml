services:
  - type: web
    name: market-digest
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: THE_KEN_COOKIE_STRING
        sync: false
      - key: REDDIT_USER_AGENT
        value: StockMarketNewsBot/1.0
      - key: WEB_PORT
        value: "10000"
      - key: SCHEDULE_TIME
        value: "07:00"
      - key: USE_WHISPER_FALLBACK
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: market-digest-db
          property: connectionString

databases:
  - name: market-digest-db
    plan: free
    databaseName: market_digest
